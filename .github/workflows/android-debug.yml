name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build espeak-ng-data

      - name: Build pinned Kokoro Android AAR with tuned ORT
        run: |
          set -euo pipefail
          KOKORO_COMMIT="593e2353954498b667e3bf3489a61723e6ba6b59"

          rm -rf .deps/kokoro-android
          mkdir -p .deps/kokoro-android app/libs

          git -C .deps/kokoro-android init
          git -C .deps/kokoro-android remote add origin \
            https://github.com/ffmpegkit-maintained/kokoro-android.git
          git -C .deps/kokoro-android fetch --depth=1 origin "$KOKORO_COMMIT"
          git -C .deps/kokoro-android checkout --detach FETCH_HEAD
          git -C .deps/kokoro-android submodule update --init --recursive --depth 1

          cd .deps/kokoro-android
          test "$(git rev-parse HEAD)" = "$KOKORO_COMMIT"

          python3 "$GITHUB_WORKSPACE/scripts/patch_kokoro_runtime.py"

          chmod +x gradlew scripts/fetch-espeak-data.sh
          ./scripts/fetch-espeak-data.sh

          mkdir -p library/src/main/assets/voices
          curl -L --fail --retry 3 \
            -o library/src/main/assets/voices/af_heart.bin \
            "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/af_heart.bin?download=true"
          echo "d583ccff3cdca2f7fae535cb998ac07e9fcb90f09737b9a41fa2734ec44a8f0b  library/src/main/assets/voices/af_heart.bin" \
            | sha256sum -c -

          ./gradlew :library:assembleRelease --stacktrace

          AAR="$(find library/build/outputs/aar -name '*-release.aar' | head -1)"
          test -n "$AAR"
          test -f "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar"

          unzip -l "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar" \
            | grep -q "libkokoro_jni.so"
          unzip -l "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar" \
            | grep -q "assets/voices/af_heart.bin"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify compile, tests and APK
        run: |
          gradle \
            :app:checkDebugAarMetadata \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --continue \
            --stacktrace

      - name: Android lint
        continue-on-error: true
        run: gradle :app:lintDebug --continue --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boloapp-phase0-v0.10-kitten-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
