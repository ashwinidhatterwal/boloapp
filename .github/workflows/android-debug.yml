name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build espeak-ng-data

      # Kokoro's README documents the Maven coordinate, but the artifact was not
      # resolvable in our CI run. Build the free AAR from the upstream source
      # instead so Phase 0 is reproducible and does not depend on publication state.
      - name: Build Kokoro Android AAR from source
        run: |
          set -euo pipefail
          rm -rf .deps/kokoro-android
          mkdir -p .deps app/libs
          git clone --recursive --depth 1 \
            https://github.com/ffmpegkit-maintained/kokoro-android.git \
            .deps/kokoro-android
          cd .deps/kokoro-android
          chmod +x gradlew scripts/fetch-espeak-data.sh
          ./scripts/fetch-espeak-data.sh
          ./gradlew :library:assembleRelease --stacktrace
          AAR="$(find library/build/outputs/aar -name '*-release.aar' | head -1)"
          test -n "$AAR"
          test -f "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar"
          unzip -l "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar" | grep -q "libkokoro_jni.so"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boloapp-phase0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
