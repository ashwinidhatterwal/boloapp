name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          set -euo pipefail

          # Keep the legacy sdkmanager call to stable packages only.
          # The runner's sdkmanager channel does not expose API 37, while AGP 9
          # can download a missing compile platform/build-tools automatically.
          # This mirrors the Supertonic SDK's own CI strategy.
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          sudo apt-get update
          sudo apt-get install -y ninja-build espeak-ng-data

      - name: Build pinned Kokoro Android AAR with tuned ORT
        run: |
          set -euo pipefail
          KOKORO_COMMIT="593e2353954498b667e3bf3489a61723e6ba6b59"

          rm -rf .deps/kokoro-android
          mkdir -p .deps/kokoro-android app/libs

          git -C .deps/kokoro-android init
          git -C .deps/kokoro-android remote add origin \
            https://github.com/ffmpegkit-maintained/kokoro-android.git
          git -C .deps/kokoro-android fetch --depth=1 origin "$KOKORO_COMMIT"
          git -C .deps/kokoro-android checkout --detach FETCH_HEAD
          git -C .deps/kokoro-android submodule update --init --recursive --depth 1

          cd .deps/kokoro-android
          test "$(git rev-parse HEAD)" = "$KOKORO_COMMIT"

          python3 "$GITHUB_WORKSPACE/scripts/patch_kokoro_runtime.py"

          # Local AAR builds must not resolve the Maven publishing plugin.
          ! grep -R "libs.plugins.vanniktech.publish" build.gradle.kts library/build.gradle.kts
          ! grep -R "mavenPublishing" library/build.gradle.kts

          # Verify the retained CPU8 Kokoro profile and long-text chunking.
          grep -q "CPU_ALL_8" library/src/main/kotlin/dev/ffmpegkit/kokoro/KokoroTTS.kt
          grep -q "MAX_MODEL_TOKENS = 500" library/src/main/kotlin/dev/ffmpegkit/kokoro/KokoroTTS.kt
          grep -q "chunkTextForModel" library/src/main/kotlin/dev/ffmpegkit/kokoro/KokoroTTS.kt
          ! grep -q "XNNPACK_" library/src/main/kotlin/dev/ffmpegkit/kokoro/KokoroTTS.kt

          chmod +x gradlew scripts/fetch-espeak-data.sh
          ./scripts/fetch-espeak-data.sh

          mkdir -p library/src/main/assets/voices

          download_voice() {
            local voice_id="$1"
            local expected_sha="$2"
            local target="library/src/main/assets/voices/${voice_id}.bin"

            curl -L --fail --retry 3 \
              -o "$target" \
              "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/${voice_id}.bin?download=true"

            echo "${expected_sha}  ${target}" | sha256sum -c -
          }

          download_voice "af_heart" "d583ccff3cdca2f7fae535cb998ac07e9fcb90f09737b9a41fa2734ec44a8f0b"
          download_voice "am_onyx" "da5d135b424164916d75a68ffb4c2abce3d7d5ccc82dd1ee6cf447ce286145e6"
          download_voice "am_michael" "1d1f21dd8da39c30705cd4c75d039d265e9bc4a2a93ed09bc9e1b1225eb95ba1"
          download_voice "bm_george" "c4b235a4c1f2cd3b939fed08b899ce9385638b763f7b73a59616c4fc9bd6c9bc"
          download_voice "am_fenrir" "c27989f741f7ee34d273a39d8a595cc0837d35f5ced9a29b7cc162614616df43"

          ./gradlew :library:assembleRelease --stacktrace

          AAR="$(find library/build/outputs/aar -name '*-release.aar' | head -1)"
          test -n "$AAR"
          test -f "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar"

          unzip -l "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar" \
            | grep -q "libkokoro_jni.so"
          for voice_id in af_heart am_onyx am_michael bm_george am_fenrir; do
            unzip -l "$GITHUB_WORKSPACE/app/libs/kokoro-android.aar" \
              | grep -q "assets/voices/${voice_id}.bin"
          done

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify compile, tests and APK
        run: |
          gradle \
            :app:checkDebugAarMetadata \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --continue \
            --stacktrace

      - name: Android lint
        continue-on-error: true
        run: gradle :app:lintDebug --continue --stacktrace

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk             build-artifacts/Bolo-v0.18-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bolo-v0.18-player
          path: build-artifacts/Bolo-v0.18-Player.apk
          if-no-files-found: error
